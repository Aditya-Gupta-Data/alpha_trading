# /etc/nginx/conf.d/desk.conf — ONE front door on :8080 for the Cloudflare tunnel:
#   /api/*      -> the read-only FastAPI bridge (127.0.0.1:8600)
#   /streamlit/ -> the Streamlit showcase (127.0.0.1:8501, baseUrlPath=streamlit)
#   /           -> the React desk (TanStack Start SSR, 127.0.0.1:3000)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 127.0.0.1:8080;
    server_name _;
    client_max_body_size 1m;
    location /api/ {
        proxy_pass http://127.0.0.1:8600;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location /streamlit/ {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
